<!doctype html>
<html lang="en" data-theme="tarot">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rift Signs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Righteous&family=Space+Grotesk:wght@400;600&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300;1,9..144,500&family=Quicksand:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="#/league">Rift Signs</a>
    <nav class="modes">
      <a href="#/league" data-mode="league">League</a>
      <a href="#/tft" data-mode="tft">TFT</a>
    </nav>
    <div class="themes" role="group" aria-label="Style">
      <button data-theme="tarot" title="Hextech tarot"></button>
      <button data-theme="paper" title="Newspaper"></button>
      <button data-theme="neon" title="Neon mystic"></button>
      <button data-theme="dusk" title="Celestial"></button>
    </div>
  </header>

  <main id="main"></main>

  <div id="reveal" hidden>
    <article class="panel" role="dialog" aria-modal="true">
      <button class="close" aria-label="Close">×</button>
      <div class="content"></div>
    </article>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
