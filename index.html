<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ptonklescopes</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Titillium+Web:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&family=VT323&family=Press+Start+2P&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="#/">Ptonklescopes</a>
    <nav class="modes">
      <a href="#/league" data-mode="league">League</a>
      <a href="#/tft" data-mode="tft">TFT</a>
      <a href="#/factorio" data-mode="factorio">Factorio</a>
      <a href="#/idle" data-mode="idle">Idle Game</a>
      <a href="#/pikmin" data-mode="pikmin">Pikmin</a>
      <a href="#/pokemon" data-mode="pokemon">Pokémon</a>
    </nav>
    <label class="volume">Volume <input id="volume" type="range" min="0" max="1" step="0.05"></label>
  </header>

  <main id="main"></main>

  <div id="reveal" hidden>
    <article class="panel" role="dialog" aria-modal="true">
      <button class="close" aria-label="Close">×</button>
      <div class="content"></div>
    </article>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
